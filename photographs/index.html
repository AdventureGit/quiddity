---
layout: default
title: Photographs
---
<header class="post-header">
  <h1 class="page-title">Photographs</h1>
  <p class="lede">What I saw when I was paying attention.</p>
</header>
<div class="photos">
{% assign photos = site.photos | sort: 'date' | reverse %}
{% for p in photos %}
  <a class="photo-card" href="{{ p.url | relative_url }}">
    <div class="thumb">{% if p.image %}<img src="{{ p.image | relative_url }}" alt="{{ p.alt | default: p.title }}" loading="lazy">{% else %}<div class="photo-placeholder"><span>photograph · {{ p.title }}</span></div>{% endif %}</div>
    <figcaption>
      <span class="cap">{{ p.caption | default: p.title }}</span>
      <span class="cap-meta">{% if p.place %}{{ p.place }} · {% endif %}{{ p.date | date: "%b %Y" }}</span>
    </figcaption>
  </a>
{% endfor %}
</div>
