title: Quiddity
tagline: "on the thoughts that shape our being"
description: >-
  Essays, notes, journal entries, and photographs from vent —
  on attention, identity, beauty in overlooked things, and how the mind works.
author: vent

# --- GitHub Pages ---
# Project site: served at https://adventuregit.github.io/quiddity/
url: "https://adventuregit.github.io"
baseurl: "/quiddity"

markdown: kramdown
kramdown:
  input: GFM
permalink: /:year/:month/:title/

plugins:
  - jekyll-feed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
