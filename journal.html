---
layout: default
title: Journal
permalink: /journal/
---
<p class="section-label">journal</p>
<p class="intro" style="font-size:1rem; margin-bottom:2rem;">Dated. Raw. Unedited on purpose.</p>

{% assign entries = site.posts | where: "category", "journal" %}
{% for post in entries %}
  <article class="journal-entry">
    <a href="{{ post.url | relative_url }}" style="text-decoration:none; color:inherit;">
      <span class="journal-date">{{ post.date | date: "%A, %B %-d, %Y" }}</span>
    </a>
    <div class="post-content">{{ post.content }}</div>
  </article>
{% else %}
  <p>Nothing here yet.</p>
{% endfor %}
