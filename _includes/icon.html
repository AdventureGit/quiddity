{% comment %}
Hand-drawn line icons, kept in one place so the style stays consistent.
Usage: {% include icon.html name="pen" %}  — pen, notepad, camera, instagram
{% endcomment %}
{% case include.name %}
{% when 'pen' %}
<svg class="section-icon icon-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="icon-draw" pathLength="1" d="M12 2 L18 8 L12 22 L6 8 Z"/><path class="icon-draw icon-draw-d1" pathLength="1" d="M12 2 L12 15"/><circle class="icon-pop" cx="12" cy="9.5" r="1.1" fill="currentColor" stroke="none"/></svg>
{% when 'notepad' %}
<svg class="section-icon icon-notepad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="icon-draw" pathLength="1" x="4" y="3" width="16" height="19" rx="1.5"/><path class="icon-draw icon-draw-d1" pathLength="1" d="M8 8H16"/><path class="icon-draw icon-draw-d2" pathLength="1" d="M8 12H16"/><path class="icon-draw icon-draw-d3" pathLength="1" d="M8 16H12"/><path class="icon-draw icon-draw-d1" pathLength="1" d="M4 6H2.3M4 10H2.3M4 14H2.3M4 18H2.3"/></svg>
{% when 'camera' %}
<svg class="section-icon icon-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle class="icon-flash" cx="12" cy="13.5" r="7" fill="currentColor" stroke="none"/><path class="icon-draw" pathLength="1" d="M3 8H7L9 5H15L17 8H21V19H3Z"/><circle class="icon-draw icon-draw-d1" pathLength="1" cx="12" cy="13.5" r="4"/><circle class="icon-pop" cx="12" cy="13.5" r="1.4" fill="currentColor" stroke="none"/></svg>
{% when 'instagram' %}
<svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r="0.6" fill="currentColor" stroke="none"/></svg>
