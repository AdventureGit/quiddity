<footer class="site-footer">
  <p class="footer-mark">Quiddity — {{ site.tagline }}.</p>
  <p class="footer-meta">
    Written by {{ site.author }} in the Philippines · <a href="{{ '/tags/' | relative_url }}">Tags</a>
    {% assign ig = site.data.content.instagram | remove: "@" | strip %}
    {% if ig != "" %}· <a href="https://instagram.com/{{ ig | uri_escape }}" class="footer-social">{% include icon.html name="instagram" %}@{{ ig | escape }}</a>{% endif %}
  </p>
</footer>
